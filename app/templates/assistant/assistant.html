#assistant-btn:hover{
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 14px 30px rgba(37,99,235,.42);
}
#assistant-btn:active{
    transform:translateY(0) scale(.97);
}
#assistant-btn svg{
    width:26px;
    height:26px;
    flex-shrink:0;
}
#assistant-btn .assistant-btn-badge{
    position:absolute;

    right:4px;

    height:10px;

    border:2px solid #fff;
}
#assistant-widget{
    position:fixed;
    right:26px;
    bottom:26px;
    z-index:9999;
}
#assistant-widget #assistant-btn{
    position:static;
}
#assistant-widget #assistant-window{
    position:absolute;
    right:0;
    bottom:72px;
}
#assistant-hide{
    position:absolute;
    top:-4px;
    left:-4px;
    width:20px;
    height:20px;
    min-width:0;
    min-height:0;
    padding:0;
    border:1px solid #e2e6f0;
    border-radius:50%;

    color:#94a3b8;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(15,23,42,.12);
    opacity:0;
    transform:scale(.85);
    transition:opacity .15s ease, transform .15s ease, background .15s ease, color .15s ease;
}
#assistant-widget:hover #assistant-hide{
    opacity:1;
    transform:scale(1);
}
#assistant-hide:hover{
    background:#f1f5f9;
    color:#475569;
}
#assistant-hide svg{
    width:10px;
    height:10px;
    flex-shrink:0;
}
#assistant-restore{
    position:fixed;
    right:0;
    bottom:60px;
    z-index:9999;
    display:none;
    align-items:center;
    gap:6px;
    padding:10px 12px 10px 14px;
    border:1px solid #e2e6f0;
    border-right:none;
    border-radius:20px 0 0 20px;
    background:white;
    color:#2563eb;
    cursor:pointer;
    box-shadow:-2px 2px 10px rgba(15,23,42,.10);
    font-size:12.5px;
    font-weight:600;
    transition:padding-right .15s ease;
}
#assistant-restore:hover{
    padding-right:16px;
}
#assistant-restore svg{
    width:18px;
    height:18px;
    flex-shrink:0;
}
#assistant-window{
    position:fixed;
    right:26px;
    bottom:98px;
    width:380px;
    height:580px;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 50px rgba(15,23,42,.22), 0 2px 8px rgba(15,23,42,.08);
    z-index:9999;
    font-family:'Segoe UI', sans-serif;
    opacity:0;
    transform:translateY(16px) scale(.98);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
}
#assistant-window.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}
#assistant-header{
    background:linear-gradient(135deg,#2563eb,#1e40af);
    color:white;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
}
#assistant-header .assistant-avatar{
    width:36px;
    height:36px;
    min-width:0;
    min-height:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}
#assistant-header .assistant-avatar svg{
    width:20px;
    height:20px;
    flex-shrink:0;
}
#assistant-header .assistant-title-block{
    flex:1;
    min-width:0;
}
#assistant-header .assistant-title{
    font-size:15.5px;
    font-weight:700;
    line-height:1.2;
}
#assistant-header .assistant-subtitle{
    font-size:12px;
    opacity:.82;
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:2px;
}
#assistant-header .assistant-subtitle .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 0 3px rgba(74,222,128,.25);
    flex-shrink:0;
}
#assistant-close{
    border:0;
    background:rgba(255,255,255,.14);
    color:white;
    width:28px;
    height:28px;
    min-width:0;
    min-height:0;
    padding:0;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:background .15s ease;
}
#assistant-close svg{
    width:14px;
    height:14px;
    flex-shrink:0;
}
#assistant-close:hover{
    background:rgba(255,255,255,.26);
}
#assistant-body{
    flex:1;
    overflow-y:auto;
    padding:16px;
    background:#f4f6fb;
    scrollbar-width:thin;
}
#assistant-body::-webkit-scrollbar{
    width:6px;
}
#assistant-body::-webkit-scrollbar-thumb{
    background:rgba(37,99,235,.2);
    border-radius:6px;
}
.assistant-message{
    margin-bottom:12px;
    display:flex;
}
.assistant-user{
    justify-content:flex-end;
}
.assistant-bot{
    justify-content:flex-start;
}
.assistant-bubble{
    display:inline-block;
    padding:10px 14px;
    border-radius:16px;
    max-width:80%;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13.5px;
    line-height:1.55;
}
.assistant-user .assistant-bubble{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border-bottom-right-radius:4px;
}
.assistant-bot .assistant-bubble{
    background:white;
    color:#1e293b;
    border:1px solid #e6e9f2;
    border-bottom-left-radius:4px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.assistant-move-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:8px 13px;
    border:0;
    background:#10b981;
    color:white;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
}
.assistant-move-btn:hover{
    background:#0ea371;
}
.assistant-move-btn:active{
    transform:scale(.97);
}
.assistant-typing{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:12px 14px;
    border-radius:16px;
    border-bottom-left-radius:4px;
    background:white;
    border:1px solid #e6e9f2;
}
.assistant-typing span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#94a3b8;
    animation:assistantTypingBounce 1.1s infinite ease-in-out;
}
.assistant-typing span:nth-child(2){ animation-delay:.15s; }
.assistant-typing span:nth-child(3){ animation-delay:.3s; }
@keyframes assistantTypingBounce{
    0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-4px); opacity:1; }
}
#assistant-footer{
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid #edf0f7;
    padding:10px 12px;
    background:white;
    flex-shrink:0;
}
#assistant-question{
    flex:1;
    border:1px solid #e2e6f0;
    background:#f4f6fb;
    border-radius:20px;
    padding:10px 16px;
    outline:none;
    font-size:13.5px;
    font-family:inherit;
    transition:border-color .15s ease, background .15s ease;
}
#assistant-question:focus{
    border-color:#93b4fb;
    background:white;
}
#assistant-question:disabled{
    opacity:.6;
}
#assistant-send{
    width:38px;
    height:38px;
    min-width:0;
    min-height:0;
    padding:0;
    flex-shrink:0;
    border:0;
    border-radius:50%;
    background:#2563eb;
    color:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, transform .1s ease;
}
#assistant-send:hover:not(:disabled){
    background:#1d4ed8;
}
#assistant-send:active:not(:disabled){
    transform:scale(.94);
}
#assistant-send:disabled{
    opacity:.5;
    cursor:default;
}
#assistant-send svg{
    width:16px;
    height:16px;
    flex-shrink:0;
}

    const GREETING = "안녕하세요.\n무엇을 도와드릴까요?";

    const assistantWidget = document.getElementById("assistant-widget");

    const assistantRestore = document.getElementById("assistant-restore");
    const assistantWindow = document.getElementById("assistant-window");

    const assistantClear = document.getElementById("assistant-clear");
    const assistantBody = document.getElementById("assistant-body");

    const assistantSend = document.getElementById("assistant-send");

    const HIDDEN_KEY = "assistant_hidden::{{ request.session.get('user', '') }}";

    function setHidden(hidden){
        assistantWidget.style.display = hidden ? "none" : "";
        assistantRestore.style.display = hidden ? "flex" : "none";

        try{
            localStorage.setItem(HIDDEN_KEY, hidden ? "1" : "0");
        }catch(err){
            console.error(err);
        }
    }

    assistantHide.onclick = (event) => {
        event.stopPropagation();
        setOpen(false);
        setHidden(true);
    };

    assistantRestore.onclick = () => setHidden(false);

    setHidden(localStorage.getItem(HIDDEN_KEY) === "1");

    function loadState(){
        try{
            const raw = localStorage.getItem(STORAGE_KEY);
            if(raw){
                return JSON.parse(raw);
            }
        }catch(err){
            console.error(err);
        }
        return { open:false, messages:[{ text:GREETING, sender:"bot" }] };
    }

    function saveState(){
        try{
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }catch(err){
            console.error(err);
        }
    }

    const state = loadState();
    let suppressLauncherClick = false;

    function applySavedPosition(){
        try{
            const saved = JSON.parse(localStorage.getItem(POSITION_KEY) || "null");
            if(!saved || !Number.isFinite(saved.left) || !Number.isFinite(saved.top)) return;
            const maxLeft = Math.max(8, window.innerWidth - assistantWidget.offsetWidth - 8);
            const maxTop = Math.max(8, window.innerHeight - assistantWidget.offsetHeight - 8);
            assistantWidget.style.left = `${Math.min(Math.max(8, saved.left), maxLeft)}px`;
            assistantWidget.style.top = `${Math.min(Math.max(8, saved.top), maxTop)}px`;
            assistantWidget.style.right = "auto";
            assistantWidget.style.bottom = "auto";
        }catch(err){
            console.error(err);
        }
    }

    function savePosition(){
        const rect = assistantWidget.getBoundingClientRect();
        try{
            localStorage.setItem(POSITION_KEY, JSON.stringify({left:rect.left, top:rect.top}));
        }catch(err){
            console.error(err);
        }
    }

    function keepAssistantOnScreen(){
        const rect = state.open
            ? assistantWindow.getBoundingClientRect()
            : assistantWidget.getBoundingClientRect();
        let dx = 0;
        let dy = 0;
        if(rect.left < 8) dx = 8 - rect.left;
        if(rect.right > window.innerWidth - 8) dx = window.innerWidth - 8 - rect.right;
        if(rect.top < 8) dy = 8 - rect.top;
        if(rect.bottom > window.innerHeight - 8) dy = window.innerHeight - 8 - rect.bottom;
        if(dx || dy){
            const widgetRect = assistantWidget.getBoundingClientRect();
            assistantWidget.style.left = `${widgetRect.left + dx}px`;
            assistantWidget.style.top = `${widgetRect.top + dy}px`;
            assistantWidget.style.right = "auto";
            assistantWidget.style.bottom = "auto";
            savePosition();
        }
    }

    function enableDrag(handle, expanded){
        handle.addEventListener("pointerdown", (event) => {
            if(event.button !== 0 || event.target.closest("button") && handle !== assistantBtn) return;

            const targetRect = expanded
                ? assistantWindow.getBoundingClientRect()
                : assistantWidget.getBoundingClientRect();
            const widgetRect = assistantWidget.getBoundingClientRect();
            const startX = event.clientX;
            const startY = event.clientY;
            let moved = false;

            handle.setPointerCapture(event.pointerId);

            const onMove = (moveEvent) => {
                const dx = moveEvent.clientX - startX;
                const dy = moveEvent.clientY - startY;
                if(Math.abs(dx) + Math.abs(dy) > 5) moved = true;

                const width = targetRect.width;
                const height = targetRect.height;
                const left = Math.min(Math.max(8, targetRect.left + dx), Math.max(8, window.innerWidth - width - 8));
                const top = Math.min(Math.max(8, targetRect.top + dy), Math.max(8, window.innerHeight - height - 8));

                const widgetLeft = expanded ? left + width - widgetRect.width : left;
                const widgetTop = expanded ? top + height - widgetRect.height : top;
                assistantWidget.style.left = `${widgetLeft}px`;
                assistantWidget.style.top = `${widgetTop}px`;
                assistantWidget.style.right = "auto";
                assistantWidget.style.bottom = "auto";
            };

            const onUp = () => {
                handle.removeEventListener("pointermove", onMove);
                handle.removeEventListener("pointerup", onUp);
                handle.removeEventListener("pointercancel", onUp);
                if(moved){
                    suppressLauncherClick = handle === assistantBtn;
                    savePosition();
                    setTimeout(() => { suppressLauncherClick = false; }, 0);
                }
            };

            handle.addEventListener("pointermove", onMove);
            handle.addEventListener("pointerup", onUp);
            handle.addEventListener("pointercancel", onUp);
        });
    }

    function setOpen(open){
        state.open = open;
        assistantWidget.classList.toggle("is-open", open);
        assistantWindow.classList.toggle("open", open);
        saveState();
        requestAnimationFrame(keepAssistantOnScreen);

        if(open){
            assistantBody.scrollTop = assistantBody.scrollHeight;
            assistantQuestion.focus();
        }
    }

    assistantBtn.onclick = () => {
        if(!suppressLauncherClick) setOpen(!state.open);
    };
    assistantClose.onclick = () => setOpen(false);
    assistantClear.onclick = () => {
        state.messages = [{ text:GREETING, sender:"bot" }];
        saveState();
        renderAll();
    };

    const logoutLink = document.querySelector('a[href="/logout"]');
    if(logoutLink){
        logoutLink.addEventListener("click", () => {
            try{
                localStorage.removeItem(STORAGE_KEY);
            }catch(err){
                console.error(err);
            }
        });
    }

    function renderBubble(message){
        const wrapper = document.createElement("div");
        wrapper.className = `assistant-message assistant-${message.sender}`;

        const bubble = document.createElement("div");
        bubble.className = "assistant-bubble";
        bubble.textContent = message.text;

        if(message.moveUrl){
            const button = document.createElement("button");
            button.className = "assistant-move-btn";
            button.type = "button";
            button.textContent = "이동하기 →";
            button.onclick = () => {
                window.location.href = message.moveUrl;
            };
            bubble.appendChild(document.createElement("br"));
            bubble.appendChild(button);
        }

        wrapper.appendChild(bubble);
        assistantBody.appendChild(wrapper);
        return bubble;
    }

    function renderAll(){
        assistantBody.innerHTML = "";
        state.messages.forEach(renderBubble);
        assistantBody.scrollTop = assistantBody.scrollHeight;
    }

    function appendMessage(text, sender, moveUrl){
        const message = { text, sender, moveUrl: moveUrl || null };
        state.messages.push(message);
        saveState();

        renderBubble(message);
        assistantBody.scrollTop = assistantBody.scrollHeight;
    }

    function showTyping(){
        const wrapper = document.createElement("div");
        wrapper.className = "assistant-message assistant-bot";
        wrapper.id = "assistant-typing-indicator";

        const typing = document.createElement("div");
        typing.className = "assistant-typing";
        typing.innerHTML = "<span></span><span></span><span></span>";

        wrapper.appendChild(typing);
        assistantBody.appendChild(wrapper);
        assistantBody.scrollTop = assistantBody.scrollHeight;
    }

    function hideTyping(){
        const el = document.getElementById("assistant-typing-indicator");
        if(el){
            el.remove();
        }
    }

    function setBusy(busy){
        assistantQuestion.disabled = busy;
        assistantSend.disabled = busy;
    }

    async function sendQuestion(){
        const q = assistantQuestion.value.trim();

        if(q === ""){
            return;
        }

        appendMessage(q, "user");
        assistantQuestion.value = "";
        setBusy(true);
        showTyping();

        try{
            const response = await fetch(
                `/assistant/chat?question=${encodeURIComponent(q)}`,
                {
                    method:"POST"
                }
            );

            const result = await response.json();
            hideTyping();
            appendMessage(
                result.message || "",
                "bot",
                result.type === "move" ? result.url : null
            );

        }catch(err){
            hideTyping();
            appendMessage("서버와 연결할 수 없습니다.", "bot");
            console.error(err);
        }finally{
            setBusy(false);
            assistantQuestion.focus();
        }
    }

    assistantSend.onclick = sendQuestion;
    document.querySelectorAll(".assistant-suggestion").forEach((button) => {
        button.addEventListener("click", () => {
            assistantQuestion.value = button.textContent.trim();
            sendQuestion();
        });
    });
    assistantQuestion.addEventListener("keypress", (event) => {
        if(event.key === "Enter"){
            sendQuestion();
        }
    });

    enableDrag(assistantBtn, false);
    enableDrag(document.getElementById("assistant-header"), true);
    applySavedPosition();
    window.addEventListener("resize", keepAssistantOnScreen);
    renderAll();
    assistantWidget.classList.toggle("is-open", state.open);
    assistantWindow.classList.toggle("open", state.open);
})();
</script>
