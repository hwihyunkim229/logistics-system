<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>비밀번호 변경</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f5f9;
    font-family:'Segoe UI', sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.password-wrap{
    width:100%;
    max-width:480px;
    padding:24px;
}

.password-card{
    background:white;
    border-radius:24px;
    padding:40px;
    box-shadow:0 12px 32px rgba(15,23,42,0.08);
}

.password-title{
    font-size:30px;
    font-weight:800;
    color:#0f172a;
    margin-bottom:10px;
}

.password-desc{
    color:#94a3b8;
    font-size:14px;
    line-height:1.5;
    margin-bottom:32px;
}

.password-form{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.password-input{
    height:54px;
    border:1px solid #dbe2ea;
    border-radius:14px;
    padding:0 16px;
    font-size:14px;
    background:#f8fafc;
    transition:0.2s;
}

.password-input:focus{
    outline:none;
    border-color:#2563eb;
    background:white;
}

.password-btn{
    height:54px;
    border:none;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:0.2s;
}

.password-btn:hover{
    background:#1d4ed8;
}

.error-msg{
    background:#fef2f2;
    color:#ef4444;
    border:1px solid #fecaca;
    padding:14px;
    border-radius:12px;
    font-size:13px;
    margin-bottom:16px;
}

.security-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;

    background:#eff6ff;
    color:#2563eb;

    padding:8px 14px;
    border-radius:999px;

    font-size:12px;
    font-weight:700;

    margin-bottom:18px;
}

</style>
<link rel="stylesheet" href="/static/css/auth-modern.css?v=20260902-2">

</head>

<body>

<div class="password-wrap">

    <div class="password-card">

        <div class="security-badge">
            🔒 최초 로그인 보안 설정
        </div>

        <div class="password-title">
            비밀번호 변경
        </div>

        <div class="password-desc">
            안전한 계정 사용을 위해<br>
            초기 비밀번호를 변경해주세요.
        </div>

        {% if error %}
        <div class="error-msg">
            {{ error }}
        </div>
        {% endif %}

        <form
            method="post"
            action="/change-password"
            class="password-form"
        >

            <input
                type="password"
                name="current_password"
                placeholder="현재 비밀번호"
                class="password-input"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="새 비밀번호"
                class="password-input"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="새 비밀번호 확인"
                class="password-input"
                required
            >

            <button
                type="submit"
                class="password-btn"
            >
                비밀번호 변경
            </button>

        </form>

    </div>

</div>

</body>
</html>
