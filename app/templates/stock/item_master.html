{% extends "base.html" %}
{% block content %}

<style>

.page-title{
    margin-bottom:25px;
    font-size:22px;
    font-weight:700;
    color:#2c3e50;
    padding-left:10px;
    border-left:4px solid #2c3e50;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.search-toolbar{

    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.search-toolbar input{

    width:400px;

    padding:10px 14px;

    border:1px solid #ddd;
    border-radius:8px;

    font-size:14px;
}

.table-container{

    max-height:800px;

    overflow-y:auto;

    border-radius:10px;
}

.master-table{

    width:100%;

    border-collapse:collapse;
}

.master-table thead th{

    position:sticky;

    top:0;

    z-index:10;

    background:#2c3e50;

    color:white;

    padding:12px;

    text-align:center;

    border-right:1px solid white;
}

.master-table thead th:last-child{

    border-right:none;
}

.master-table td{

    padding:12px;

    text-align:center;

    border-bottom:1px solid #eee;

    border-right:1px solid #eee;
}

.master-table td:last-child{

    border-right:none;
}

.master-table tbody tr:hover{

    background:#f8f9fb;
}

.master-table td:nth-child(2){

    max-width:500px;

    word-break:break-all;
}

.edit-btn{
    padding:8px 16px;
    border:none;
    border-radius:8px;
    background:#2c3e50;
    color:white;
    cursor:pointer;
}

.modal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.modal-content{
    width:420px;
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
}

.modal-content h3{
    margin-bottom:20px;
    text-align:center;
}

.modal-content label{
    display:block;
    margin-bottom:6px;
    font-weight:600;
}

.modal-content input{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:8px;
    margin-bottom:15px;
    box-sizing:border-box;
}

.modal-buttons{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
}

.modal-buttons button{

    min-width:120px;
    height:44px;

    border:none;
    border-radius:10px;

    font-size:15px;
    font-weight:600;

    cursor:pointer;

    transition:all .2s ease;
}

.modal-buttons button:hover{

    transform:translateY(-1px);
}

.modal-buttons button:first-child{
    background:#2c3e50;
    color:white;
}

.modal-buttons button:last-child{
    background:#ddd;
    color:#333;
}

</style>

<h2 class="page-title">
    품목 관리
</h2>

<div class="card">

    <div class="search-toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="검색어를 입력하세요.">

        <div>

            <button
                class="edit-btn"
                onclick="document.getElementById('excelFile').click()">

                엑셀 업로드

            </button>

            <button
                class="edit-btn"
                onclick="location.href='/stock/item-master/history'">

                변경 이력

            </button>

        </div>

    </div>

    <input
        type="file"
        id="excelFile"
        accept=".xlsx,.xls"
        style="display:none;"
        onchange="uploadItemMasterExcel(this)">

    <div class="table-container">

        <table
            class="master-table"
            id="masterTable">

            <thead>

                <tr>

                    <th>품목코드</th>
                    <th>품명</th>
                    <th>Rev</th>
                    <th>관리</th>

                </tr>

            </thead>

            <tbody>

                {% for item in items %}

                <tr>

                    <td>{{ item.item_code }}</td>

                    <td>{{ item.item_name }}</td>

                    <td>{{ item.rev }}</td>

                    <td>

                        <button
                            class="edit-btn"
                            data-id="{{ item.id }}"
                            data-code="{{ item.item_code }}"
                            data-name="{{ item.item_name }}"
                            data-rev="{{ item.rev }}"
                            onclick="openEditModalFromButton(this)">

                            수정

                        </button>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<div
    id="editModal"
    class="modal">

    <div class="modal-content">

        <h3>
            품목 수정
        </h3>

        <input
            type="hidden"
            id="itemId">

        <label>
            품목코드
        </label>

        <input
            type="text"
            id="itemCode">

        <label>
            품명
        </label>

        <input
            type="text"
            id="itemName">

        <label>
            Rev
        </label>

        <input
            type="text"
            id="itemRev">

        <div class="modal-buttons">

            <button
                onclick="saveItem()">

                저장

            </button>

            <button
                onclick="closeModal()">

                취소

            </button>

        </div>

    </div>

</div>

<div
    id="confirmModal"
    class="modal">

    <div class="modal-content">

        <h3>
            변경 확인
        </h3>

        <p style="text-align:center;">
            내용을 수정하시겠습니까?
        </p>

        <div class="modal-buttons">

            <button
                onclick="confirmSaveItem()">

                확인

            </button>

            <button
                onclick="closeConfirmModal()">

                취소

            </button>

        </div>

    </div>

</div>

<div
    id="resultModal"
    class="modal">

    <div class="modal-content">

        <h3>
            처리 완료
        </h3>

        <p id="resultMessage" style="text-align:center;"></p>

        <div class="modal-buttons">

            <button
                onclick="closeResultModal()">

                확인

            </button>

        </div>

    </div>

</div>

<script>

function openEditModalFromButton(btn){

    document.getElementById("itemId").value =
        btn.dataset.id;

    document.getElementById("itemCode").value =
        btn.dataset.code;

    document.getElementById("itemName").value =
        btn.dataset.name;

    document.getElementById("itemRev").value =
        btn.dataset.rev || "";

    document.getElementById("editModal").style.display =
        "flex";
}

function closeModal(){

    document.getElementById(
        "editModal"
    ).style.display = "none";
}

function openResultModal(message){

    document.getElementById(
        "resultMessage"
    ).innerText = message;

    document.getElementById(
        "resultModal"
    ).style.display = "flex";
}

function closeResultModal(){

    location.reload();
}

function saveItem(){

    document
    .getElementById(
        "editModal"
    )
    .style.display = "none";

    document
    .getElementById(
        "confirmModal"
    )
    .style.display = "flex";
}

const searchInput =
    document.getElementById(
        "searchInput"
    );

if(searchInput){

    searchInput.addEventListener(
        "keyup",
        function(){

            const keyword =
                this.value.toLowerCase();

            document
            .querySelectorAll(
                "#masterTable tbody tr"
            )
            .forEach(row=>{

                const text =
                    row.innerText.toLowerCase();

                row.style.display =
                    text.includes(keyword)
                    ? ""
                    : "none";

            });

        }
    );
}

function closeConfirmModal(){

    document
    .getElementById(
        "confirmModal"
    )
    .style.display = "none";

    document
    .getElementById(
        "editModal"
    )
    .style.display = "flex";
}

async function confirmSaveItem(){

    const response =
        await fetch(
            "/stock/item-master/update",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    id:
                        document.getElementById("itemId").value,

                    item_code:
                        document.getElementById("itemCode").value,

                    item_name:
                        document.getElementById("itemName").value,

                    rev:
                        document.getElementById("itemRev").value
                })
            }
        );

    const result =
        await response.json();

    if(result.status === "success"){

        document.getElementById(
            "confirmModal"
        ).style.display = "none";

        openResultModal(
            "수정이 완료되었습니다."
        );

    }else{

        openResultModal(
            result.message
        );
    }
}

async function uploadItemMasterExcel(input){

    const file = input.files[0];

    if(!file){
        return;
    }

    const formData = new FormData();

    formData.append(
        "file",
        file
    );

    const response = await fetch(

        "/stock/item-master/upload",

        {
            method:"POST",
            body:formData
        }
    );

    const result =
        await response.json();

    openResultModal(
        result.message
    );
}

</script>

{% endblock %}
